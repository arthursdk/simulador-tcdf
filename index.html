const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function kek(pw, saltB64){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(saltB64), iterations:DATA.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function unlock(pw){
  let cek=null;
  for(const w of DATA.wraps){
    try{
      const k = await kek(pw, w.salt);
      cek = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(w.iv)}, k, b64d(w.ct)));
      break;
    }catch(e){}
  }
  if(!cek) throw new Error('bad');
  const cekKey = await crypto.subtle.importKey('raw', cek, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(DATA.piv)}, cekKey, b64d(DATA.pct));
  return new TextDecoder().decode(pt);
}
document.getElementById('eye').addEventListener('click', ()=>{ const p=document.getElementById('pw'); p.type = p.type==='password' ? 'text' : 'password'; p.focus(); });
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const err=document.getElementById('err'), wait=document.getElementById('wait');
  err.classList.add('hidden'); wait.classList.remove('hidden');
  try{
    const html = await unlock(document.getElementById('pw').value);
    const f = document.createElement('iframe');
    f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';
    document.body.innerHTML=''; document.body.appendChild(f);
    f.srcdoc = html;
  }catch(_){ wait.classList.add('hidden'); err.classList.remove('hidden'); }
});
